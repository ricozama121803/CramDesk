[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm"
version = "0.1.0"
description = "Clock in/out from the terminal, log what you did, export a weekly log + invoice PDF."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enrico Zamarripa" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "reportlab>=4",
    "pypdfium2>=4",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5"]

[project.scripts]
crm = "crm.cli:run"

[tool.setuptools]
packages = ["crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
