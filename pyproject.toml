[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cram"
version = "0.1.0"
description = "Track your study hours from the terminal: start a session, note what you covered, stop."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enrico Zamarripa" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5"]

[project.scripts]
cram = "cram.cli:run"

[tool.setuptools]
packages = ["cram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
